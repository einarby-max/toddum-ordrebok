<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unimicro-kobling</title>
<style>
:root{--bg:#faf8f2;--ink:#2b2b2b;--muted:#6b6b6b;--line:#e3ddcf;--accent:#2d5a45;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f1d;--ink:#ecebe6;--muted:#a5a59e;--line:#3a3f3b;--accent:#7fb89a;--card:#252a27}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-weight:500;font-size:24px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select,input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
label{display:block;margin:8px 0}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.04);padding:10px;border-radius:8px;max-height:420px;overflow:auto;font-size:12.5px}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{color:var(--accent)}.feil{color:#b3412f}
</style>
</head>
<body>
<main>
<h1>Unimicro-kobling</h1>
<p class="hint">Test av innlogging og lesing fra Unimicro for ordreboka. Siden leser bare, den endrer ingenting i Unimicro.</p>
<div class="card">
  <label>Miljø
    <select id="env"><option value="test">Test (test.unimicro.no)</option><option value="prod">Produksjon (app.unimicro.no)</option></select></label>
  <label>Tilganger (scope)<br><input id="scope" style="width:100%"></label>
  <div class="row"><button class="btn primary" id="login">Logg inn i Unimicro</button><button class="btn" id="logout">Logg ut</button><span id="status" class="hint"></span></div>
</div>
<div class="card" id="firma" hidden>
  <label>Selskap <select id="company"></select></label>
  <div class="row">
    <button class="btn" data-q="customers?top=5&expand=Info&select=ID,CustomerNumber,Info.Name">5 kunder</button>
    <button class="btn" data-q="products?top=5&select=ID,PartName,Name,PriceExVat">5 produkter</button>
    <button class="btn" data-q="orders?top=5&orderby=ID desc&select=ID,OrderNumber,CustomerName,TaxExclusiveAmount,StatusCode">5 siste ordre</button>
    <button class="btn" data-q="invoices?top=5&orderby=ID desc&select=ID,InvoiceNumber,CustomerName,TaxExclusiveAmount,RestAmount,PaymentDueDate,StatusCode">5 siste fakturaer</button>
  </div>
</div>
<div class="card"><pre id="ut">Ikke logget inn.</pre></div>
</main>
<script>
const CLIENT_ID = "46b68e78-3649-4386-99fa-e5e05d41677c";
const ENV = {
  test: { auth: "https://test-login.unimicro.no", api: "https://test.unimicro.no" },
  prod: { auth: "https://login.unimicro.no", api: "https://app.unimicro.no" }
};
const SCOPE_STD = "openid profile AppFramework";
const $ = s => document.querySelector(s), ut = t => $("#ut").textContent = typeof t === "string" ? t : JSON.stringify(t, null, 2);
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: k => { try { sessionStorage.removeItem(k); } catch (e) {} } };
const redirect = location.origin + location.pathname;
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const tilfeldig = n => b64u(crypto.getRandomValues(new Uint8Array(n)));
async function discovery(env) { const r = await fetch(ENV[env].auth + "/.well-known/openid-configuration"); if (!r.ok) throw new Error("Fant ikke innloggingsserveren (" + r.status + ")"); return r.json(); }

$("#env").value = ss.get("um_env") || "test";
$("#scope").value = ss.get("um_scope") || SCOPE_STD;

$("#login").onclick = async () => {
  try {
    const env = $("#env").value, scope = $("#scope").value.trim(); ss.set("um_env", env); ss.set("um_scope", scope);
    const d = await discovery(env), verifier = tilfeldig(48), state = tilfeldig(16);
    const challenge = b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    ss.set("um_verifier", verifier); ss.set("um_state", state);
    const q = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: redirect, response_type: "code", scope, state, code_challenge: challenge, code_challenge_method: "S256" });
    location.href = d.authorization_endpoint + "?" + q;
  } catch (e) { ut("Feil: " + e.message); }
};
$("#logout").onclick = () => { ["um_token", "um_exp", "um_company"].forEach(ss.del); visStatus(); ut("Logget ut fra ordreboka sin Unimicro-kobling."); $("#firma").hidden = true; };

async function callback() {
  const p = new URLSearchParams(location.search);
  if (p.get("error")) { ut("Innloggingen ble avvist: " + p.get("error") + "\n" + (p.get("error_description") || "")); history.replaceState(null, "", redirect); return; }
  const code = p.get("code"); if (!code) return;
  history.replaceState(null, "", redirect);
  if (p.get("state") !== ss.get("um_state")) { ut("Innloggingen kunne ikke bekreftes (state stemmer ikke). Prøv igjen."); return; }
  const env = ss.get("um_env") || "test", d = await discovery(env);
  const body = new URLSearchParams({ grant_type: "authorization_code", client_id: CLIENT_ID, code, redirect_uri: redirect, code_verifier: ss.get("um_verifier") || "" });
  const r = await fetch(d.token_endpoint, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
  const j = await r.json().catch(() => ({}));
  ss.del("um_verifier"); ss.del("um_state");
  if (!r.ok || !j.access_token) { ut({ feil: "Fikk ikke token", status: r.status, svar: j }); return; }
  ss.set("um_token", j.access_token); ss.set("um_exp", String(Date.now() + (j.expires_in || 3600) * 1000));
}
const token = () => { const t = ss.get("um_token"), e = Number(ss.get("um_exp") || 0); return t && e > Date.now() ? t : null; };
function visStatus() { const t = token(); $("#status").innerHTML = t ? `<span class="ok">✓ Logget inn (${esc($("#env").selectedOptions[0].text)})</span>` : "Ikke logget inn"; }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(path, company) {
  const env = ss.get("um_env") || "test", h = { Authorization: "Bearer " + token(), Accept: "application/json" };
  if (company) h.CompanyKey = company;
  const r = await fetch(ENV[env].api + path, { headers: h }); const txt = await r.text(); let j; try { j = JSON.parse(txt); } catch (e) { j = txt; }
  if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { svar: j }); return j;
}
async function lastSelskap() {
  try {
    const c = await api("/api/init/companies");
    const liste = Array.isArray(c) ? c : (c.Data || c.companies || []);
    $("#company").innerHTML = liste.map(x => `<option value="${esc(x.Key || x.key)}">${esc(x.Name || x.name)}</option>`).join("");
    if (ss.get("um_company")) $("#company").value = ss.get("um_company");
    $("#firma").hidden = false;
    ut({ selskaper: liste.map(x => ({ navn: x.Name || x.name, orgnr: x.OrganizationNumber || "", key: x.Key || x.key })) });
  } catch (e) { ut({ feil: "Klarte ikke å hente selskaper: " + e.message, svar: e.svar }); }
}
$("#company").onchange = e => ss.set("um_company", e.target.value);
document.querySelectorAll("[data-q]").forEach(b => b.onclick = async () => {
  const c = $("#company").value; ss.set("um_company", c); ut("Henter …");
  try { ut(await api("/api/biz/" + b.dataset.q, c)); } catch (e) { ut({ feil: e.message, svar: e.svar }); }
});
(async () => { try { await callback(); } catch (e) { ut("Feil: " + e.message); } visStatus(); if (token()) lastSelskap(); })();
</script>
</body>
</html>
