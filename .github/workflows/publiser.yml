name: Publiser til Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app
          skip_app_build: true
